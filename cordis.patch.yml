# dsh-path-guard — 按路径限制 AI 的文件访问，在 danger-full-access 下依然生效。
#
# 纯插入：不覆盖任何上游 row，不替换任何服务。
# 本 row 的 id (`path-guard`) 同时是前端配置页写入的 settings 命名空间。
#
# 规则默认留空 => 插件处于「已武装但不拦截」状态，装完不会改变任何现有行为。
# 在「设置 → 路径守卫」页面里添加规则即可开始保护；页面写入的就是这个 config。
#
# 想先跑一遍验收，照着 docs/ACCEPTANCE.md 做即可。

- insert:
    - id: path-guard
      name: 'dsh-path-guard'
      config:
        enabled: true
        defaultAccess: allow
        rules: []
